[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-tabulator"
version = "0.1.0"
description = "Minimal Dash wrapper for Tabulator with a Mantine-compatible default theme"
requires-python = ">=3.9"
dependencies = ["dash>=3.0"]

[tool.setuptools.packages.find]
include = ["dash_tabulator*"]

[tool.setuptools.package-data]
dash_tabulator = ["*.js", "*.js.map", "*.css", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
